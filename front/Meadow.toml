[package]
name = "Idyll"
version = "0.1.0"

# Idyll's compiler, written in Meadow with Lingua: the front end, which
# emits Cut for Meadow's back end, and a CEK machine on Idyll's Core, which
# is what an Idyll program means. The Rust compiler in compiler/ is the
# reference it is checked against, pass by pass, until it takes over.

[dependencies]
# Lingua at the rev Cut pins (d3b76b8, with make!'s parts and its resolver): Cut's builders take a `Lingua.Lang.Meta`, and
# two Lingua revs in one build are two types of it.
Lingua = { git = "https://github.com/meadow-lang/Lingua.git", rev = "d3b76b84eb9d9de15d298faf045cc2e201f2cfd8" }
Scythe = { git = "https://github.com/meadow-lang/Scythe.git", branch = "master" }
# Building Cut, the back end's IR, shared with MeadowBoot
Cut = { git = "https://github.com/meadow-lang/Cut.git", rev = "3d96fa0a92702f8cea82af6976e66e769aa67d0b" }

# Bytecode, on the JIT, while iterating.
[profile.debug]
runtime = "glade"

# Native, for the test suites.
[profile.release]
runtime = "silo"
