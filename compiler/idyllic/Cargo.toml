[package]
name = "idyllic"
description = "The official compiler for the Idyll programming language"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "idyllic"
path = "src/main.rs"

[dependencies]
