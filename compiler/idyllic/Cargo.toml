idyllic-lexer.workspace = true
idyllic-llvm.workspace = true
idyllic-parser.workspace = true
idyllic-rename.workspace = true
idyllic-scc.workspace = true
idyllic-span.workspace = true
idyllic-typecheck.workspace = true
clap.workspace = true
