[package]
name = "idyllic"
version = "0.1.0"
description = "The official compiler for the Idyll programming language"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "idyllic"
path = "src/main.rs"

[dependencies]
ariadne = "0.6.0"
chumsky = "0.13.0"
clap = { version = "4.6.7", features = ["derive"] }
logos = "0.16.1"
num-bigint = "0.5.1"
rustyline = { version = "18.0.1", features = ["derive"] }
