[workspace]
resolver = "2"
# One crate per pass of the compiler, each in a directory of its own here.
members = ["*"]
exclude = ["target"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "BSD-3-Clause"
authors = ["Chris McDearman <mcdearmanchris@gmail.com>"]

[workspace.dependencies]
ariadne = "0.6.0"
chumsky = "0.13.0"
clap = { version = "4.6.7", features = ["derive"] }
logos = "0.16.1"
num-bigint = { version = "0.5.1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }

idyllic-ast = { path = "idyllic-ast" }
idyllic-seq = { path = "idyllic-seq" }
idyllic-builtins = { path = "idyllic-builtins" }
idyllic-diagnostics = { path = "idyllic-diagnostics" }
idyllic-hir = { path = "idyllic-hir" }
idyllic-layout = { path = "idyllic-layout" }
idyllic-lexer = { path = "idyllic-lexer" }
idyllic-llvm = { path = "idyllic-llvm" }
idyllic-parser = { path = "idyllic-parser" }
idyllic-rename = { path = "idyllic-rename" }
idyllic-scc = { path = "idyllic-scc" }
idyllic-span = { path = "idyllic-span" }
idyllic-typecheck = { path = "idyllic-typecheck" }
idyllic-world = { path = "idyllic-world" }
idyllic-cut = { path = "idyllic-cut" }
