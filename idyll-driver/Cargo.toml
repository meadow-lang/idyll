[package]
name = "idyll-driver"
description = "The idyll command: the REPL, and the home of the build system"
version = "0.1.0-alpha"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Chris McDearman <mcdearmanchris@gmail.com>"]

# Not part of the compiler's workspace (compiler/): the driver is a client of
# the compiler, not a pass of it.  It builds into the shared target/ at the
# root (see .cargo/config.toml).
[workspace]

[lib]
name = "idyll"
path = "src/lib.rs"

[[bin]]
name = "idyll"
path = "src/main.rs"

[dependencies]
idyllic = { path = "../compiler/idyllic" }
idyllic-ast = { path = "../compiler/idyllic-ast" }
idyllic-layout = { path = "../compiler/idyllic-layout" }
idyllic-lexer = { path = "../compiler/idyllic-lexer" }
idyllic-parser = { path = "../compiler/idyllic-parser" }
idyllic-typecheck = { path = "../compiler/idyllic-typecheck" }
idyll-eval = { path = "../idyll-eval" }
idyllic-diagnostics = { path = "../compiler/idyllic-diagnostics" }
idyllic-llvm = { path = "../compiler/idyllic-llvm" }
idyllic-span = { path = "../compiler/idyllic-span" }
postcard = { version = "1.1.3", features = ["use-std"] }
clap = { version = "4.6.7", features = ["derive"] }
rustyline = { version = "18.0.1", features = ["derive", "custom-bindings"] }
# The pop-ups: the `Ctrl-F` finder and `:ir`'s viewer, as Meadow's finder.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Fuzzy matching of names, as Helix's pickers (and Meadow's finder) do.
nucleo-matcher = "0.3"
